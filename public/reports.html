<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>历史报告 · 计算不可约性</title>
<link rel="stylesheet" href="./styles.css" />
<style>
  .report { border-top: 1px solid var(--line); padding: 16px 0; }
  .report:first-child { border-top: none; padding-top: 0; }
  .report h3 { margin: 0 0 6px; font-size: 15px; }
  .report .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .report .body { font-size: 14px; line-height: 1.75; white-space: pre-wrap; }
  .report .body strong { color: var(--accent-2); }
  .filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip { background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    padding: 5px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .chip.on { color: #fff; border-color: rgba(255,77,103,.6); background: rgba(255,77,103,.16); }
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="hero-main">
      <div class="badge">报告归档</div>
      <h1>每天写给自己的简报</h1>
      <p class="muted">账号数据、领域趋势、行动建议的完整历史，按时间倒序</p>
      <div class="meta"><a href="./index.html" style="color:var(--accent-2)">← 账号简报</a>
        <span class="dot">·</span><a href="./topics" style="color:var(--accent-2)">热点雷达</a></div>
    </div>
  </header>

  <div class="card">
    <div class="filter" id="filter"></div>
    <div id="list"></div>
  </div>
</div>
<script>
(function () {
  var all = [], kind = "全部";

  function mdLite(s) {
    var esc = s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    esc = esc.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    return esc;
  }

  function render() {
    var box = document.getElementById("list");
    var rows = all.filter(function (r) { return kind === "全部" || r.kind === kind; });
    box.innerHTML = "";
    if (!rows.length) { box.textContent = "还没有报告，等第一次定时任务跑完就有了。"; return; }
    rows.forEach(function (r) {
      var d = document.createElement("div");
      d.className = "report";
      var h = document.createElement("h3");
      h.textContent = r.date + " · " + r.kind;
      var sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = r.time + " · " + r.chars + " 字";
      var body = document.createElement("div");
      body.className = "body";
      body.innerHTML = mdLite(r.text);
      d.appendChild(h); d.appendChild(sub); d.appendChild(body);
      box.appendChild(d);
    });
  }

  function chips() {
    var kinds = ["全部"].concat(Array.from(new Set(all.map(function (r) { return r.kind; }))));
    var box = document.getElementById("filter");
    box.innerHTML = "";
    kinds.forEach(function (k) {
      var b = document.createElement("button");
      b.className = "chip" + (k === kind ? " on" : "");
      b.textContent = k;
      b.onclick = function () { kind = k; chips(); render(); };
      box.appendChild(b);
    });
  }

  fetch("./data/reports.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
    all = d.reports || [];
    chips(); render();
  }).catch(function (e) {
    document.getElementById("list").textContent = "报告索引加载失败：" + e.message;
  });
})();
</script>
</body>
</html>
